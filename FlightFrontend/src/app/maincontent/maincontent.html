<div class="maincontent-container">
  <div class="card icao">
    <div class="header">
      <div class="header-icon">✈️</div>
      <div>
        <h1>Tolka ICAO-kod</h1>
        <div class="subtitle">Hämta aktuell METAR för flygplats baserat på ICAO-kod</div>
      </div>
    </div>
    <div class="form">
      <input
        (click)="dropdown()"
        class="input"
        id="icao-input"
        placeholder="Sök flygplats (ICAO eller namn)"
        list="airport-list"
      />
      <datalist class="dropdown-list" id="airport-list">
        <div id="dropdown-content">
          @for (airport of airports; track airport.ident) {
            <option>
              <strong>{{ airport.ident }}</strong> {{ airport.name }}
            </option>
          } @empty {
            <p>Inga flygplatser hittades.</p>
          }
        </div>
      </datalist>
    </div>

    <div class="actions">
      <button class="btn" (click)="runICAO()">Välj</button>
    </div>

    <div id="result">
      <h2>RESULTAT</h2>
    </div>
  </div>
</div>

<div class="maincontent-container">
  <div class="card icao">
    <div class="header">
      <div class="header-icon">✈️</div>
      <div>
        <h1>Tolka ICAO-kod</h1>
        <div class="subtitle">Hämta aktuell METAR för flygplats</div>
      </div>
    </div>

    <label for="icao-input">ICAO-kod</label>
    <div class="dropdown">
      <input
        (click)="dropdown()"
        class="input"
        id="icao-input"
        placeholder="Sök flygplats (ICAO eller namn)"
      />
      <div id="myDropdown" class="dropdown-content">
        @for (airport of airports; track airport.ident) {
          <p style="margin: 0; padding: 4px 0" (click)="selectAirport(airport)">
            <strong>{{ airport.ident }}</strong> - {{ airport.name }}
          </p>
        } @empty {
          <p>Inga flygplatser hittades.</p>
        }
      </div>
    </div>

    <div class="actions">
      <button class="btn" (click)="runICAO()">SÖK</button>
    </div>

    <div id="result">
      <h2>RESULTAT</h2>
      <div>
        <strong><p>METAR:</p></strong>
        <p id="metarString"></p>
      </div>
      <table>
        <tr>
          <th></th>
        </tr>
        <tr>
          <th></th>
        </tr>
        <tr>
          <th></th>
        </tr>
        <tr>
          <th></th>
        </tr>
        <tr>
          <th></th>
        </tr>
      </table>

</div>

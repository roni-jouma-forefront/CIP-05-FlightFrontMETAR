<div class="maincontent-container">
  <div class="card icao">
    <div class="header">
      <div class="header-icon">✈️</div>
      <div>
        <h1>Tolka ICAO-kod</h1>
        <div class="subtitle"><p>Hämta aktuell METAR för flygplats baserat på ICAO-kod</p></div>
      </div>
    </div>
    <div class="form">
      <input
        (click)="dropdown()"
        class="input"
        id="icao-input"
        placeholder="Sök flygplats (ICAO eller namn)"
        list="airport-list"
      />
      <datalist class="dropdown-list" id="airport-list">
        <div id="dropdown-content">
          @for (airport of airports; track airport.ident) {
            <option>
              <strong>{{ airport.ident }}</strong> {{ airport.name }}
            </option>
          } @empty {
            <p>Inga flygplatser hittades.</p>
          }
        </div>
      </datalist>
      <div class="actions">
        <button class="btn" (click)="runICAO()">Sök</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <div class="card icao">
    <div class="header">
      <div class="header-icon">🔧</div>
      <div>
        <h1>Tolka METAR-sträng</h1>
        <div class="subtitle"><p>Tolka en metar-sträng</p></div>
      </div>
    </div>
    <form>
      <input class="input" id="metar-input" placeholder="Klistra in METAR här" />
    </form>

    <div class="actions">
      <button class="btn" (click)="runMetar()">Tolka</button>
    </div>

    <div id="result"></div>
  </div>
</div>
